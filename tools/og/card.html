<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root { --bg: #0f0f11; --ink: #ededee; --soft: #cfcfd3; --muted: #9a9aa2; --accent: #fb923c; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px; background: var(--bg); color: var(--ink);
          font-family: Inter, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .kicker { font-family: "JetBrains Mono", monospace; font-size: 27px; color: var(--accent); margin: 0 0 22px; }
  .kicker, .title, .sub { flex-shrink: 0; }
  .name { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 116px; line-height: 1; letter-spacing: -0.01em; margin: 0 0 26px; }
  .pitch { font-size: 34px; line-height: 1.35; color: var(--soft); margin: 0; max-width: 760px; }
  .main { margin: auto 0; }
  .avatar { position: absolute; right: 84px; top: 50%; transform: translateY(-58%); width: 200px; height: 200px; border-radius: 50%; }
  .url-only { font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--muted); margin: 0; }
  .nowrap { white-space: nowrap; }
  .title { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 88px; line-height: 1.04; letter-spacing: -0.01em; margin: 0; max-width: 1020px; }
  .sub { font-size: 30px; line-height: 1.35; color: var(--muted); margin: 22px 0 0; max-width: 980px;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 18px; font-size: 26px; color: var(--soft); }
  .foot img { width: 60px; height: 60px; border-radius: 50%; }
  .foot .who { color: var(--ink); font-weight: 500; }
  .foot .url { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 24px; margin-left: auto; }
</style></head>
<body>
<div id="card" class="card"></div>
<script>
  const d = JSON.parse(new URLSearchParams(location.search).get('d'));
  const card = document.getElementById('card');
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const keepCompounds = (t) => t.replace(/[^\s<>]+-[^\s<>]+/g, (w) => `<span class="nowrap">${w}</span>`);
  const avatar = '../../content/authors/admin/face.jpg';
  if (d.kind === 'post') {
    card.innerHTML =
      `<p class="kicker">${esc(d.kicker)}</p>` +
      `<h1 class="title">${keepCompounds(esc(d.title))}</h1>` +
      (d.sub ? `<p class="sub">${keepCompounds(esc(d.sub))}</p>` : '') +
      `<div class="foot"><img src="${avatar}" alt=""><span class="who">${esc(d.name)}</span><span class="url">${esc(d.url)}</span></div>`;
  } else {
    card.innerHTML =
      `<img class="avatar" src="${avatar}" alt="">` +
      `<div class="main"><p class="kicker">${esc(d.kicker)}</p><h1 class="name">${esc(d.name)}</h1><p class="pitch">${esc(d.pitch)}</p></div>` +
      `<p class="url-only">${esc(d.url)}</p>`;
  }
  const images = [...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }));
  Promise.all([document.fonts.ready, ...images]).then(() => {
    const title = card.querySelector('.title');
    let size = 88;
    while (title && card.scrollHeight > card.clientHeight && size > 56) {
      size -= 4;
      title.style.fontSize = size + 'px';
    }
    window.__ready = {fits: card.scrollHeight <= card.clientHeight, size};
  });
</script>
</body></html>
