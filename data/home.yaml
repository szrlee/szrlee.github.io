hero:
  kicker: Member of Technical Staff · <span class="hp-nocase">xAI</span>
  display_name: Yingru (Richard) Li
  pitch: I make reinforcement learning on frontier models stable, efficient, and scalable.
  text: |-
    I am a core contributor to RL fundamentals at [xAI](https://x.ai/) (now SpaceX Super Intelligence), contributing to the Grok RL big runs and to one of the longest stable RL runs to date.
    Before that I led RL stability and efficiency research for LLM reasoning and agents at ByteDance.

    Ph.D. in Computer and Information Engineering, The Chinese University of Hong Kong (2025), advised by [Prof. Zhi-Quan (Tom) Luo](https://tomluo123.github.io/), with [Prof. Benjamin Van Roy](https://web.stanford.edu/~bvr/) (Stanford & DeepMind) on my thesis committee.
  research_link: Research overview →

highlights:
  - title: Why LLM-RL collapses, and the fix
    text: >-
      We traced collapse to the training–inference mismatch and introduced
      **masked importance sampling (MIS)**, made principled as Trust Region Masking (TRM).
      Adopted, shipped, or discussed by:
    chips: adoption
    link: {text: "Read: When Speed Kills Stability", url: "/rl-collapse"}
  - title: Open-source RL infrastructure
    text: >-
      Authored the Rollout Correction framework for general off-policy training in veRL
      (20k+ GitHub stars), and contributed its variance-reducing token-level baseline.
    link: {text: veRL docs, url: "https://verl.readthedocs.io/en/latest/algo/rollout_corr.html"}
  - title: Scalable exploration
    text: >-
      Exploration that matches Thompson sampling with only Θ(d log T) ensemble directions, and
      human-level Atari with 15% of DDQN's interaction data.
    link: {text: How it works, url: "/research/#q-explore"}

