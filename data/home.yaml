hero:
  kicker: Member of Technical Staff · <span class="hp-nocase">xAI</span>
  display_name: Yingru (Richard) Li
  pitch: Learning from experience, at frontier scale.
  text: |-
    Core contributor to RL fundamentals at [xAI](https://x.ai/) (now SpaceX Super Intelligence), on the **Grok RL big runs** and **one of the longest stable RL runs to date**. Previously led RL stability and efficiency research at ByteDance.

    PhD, The Chinese University of Hong Kong (2025), advised by [Prof. Zhi-Quan (Tom) Luo](https://tomluo123.github.io/), with [Prof. Benjamin Van Roy (Stanford & DeepMind)](https://web.stanford.edu/~bvr/) on my thesis committee.
  research_link: Research overview →

highlights:
  - title: Why LLM-RL collapses, and the fix
    text: >-
      Among the first (Sep 2025) to trace LLM-RL collapse to the training–inference mismatch.
      Our fix, masked importance sampling (MIS), made principled as Trust Region Masking (TRM),
      is adopted, shipped or discussed by:
    chips: adoption
    links:
      - {text: "Read: When Speed Kills Stability", url: "/rl-collapse"}
  - title: Open-source RL infrastructure
    text: >-
      Authored two parts of veRL (20k+ GitHub stars): the Rollout Correction framework for
      off-policy training, where MIS and TRM ship, and the Optimal Token Baseline.
    links:
      - {text: Rollout Correction docs, url: "https://verl.readthedocs.io/en/latest/algo/rollout_corr.html"}
      - {text: Token baseline docs, url: "https://verl.readthedocs.io/en/latest/algo/otb.html"}
  - title: Agentic RL for GPU kernel generation
    text: >-
      Dr. Kernel-14B writes Triton kernels and refines them using execution feedback; its multi-turn RL
      pairs an unbiased turn-level advantage with our mismatch correction against early collapse.
      With test-time scaling, 31.6% of its KernelBench Level 2 kernels run at least 1.2× faster than
      PyTorch, ahead of Claude-4.5-Sonnet (26.7%) and GPT-5 (28.6%).
    links:
      - {text: Paper, url: "https://arxiv.org/abs/2602.05885"}
      - {text: "Code, models and data", url: "https://github.com/hkust-nlp/KernelGYM"}
  - title: Data‑efficient exploration at scale
    text: >-
      Exploration whose cost stays one SGD step as data grows: human-level Atari with 15% of DDQN's
      interaction data, and Thompson-sampling regret with only Θ(d log T) ensemble directions.
    links:
      - {text: How it works, url: "/research/#q-explore"}

