outlook:
  label: Outlook
  title: Toward learners that keep learning
  text: >-
    A model that keeps learning in deployment is the same loop with no last step. It cannot afford
    to explore by temperature, retrain from scratch, or trust data written by an earlier self. The
    tools above are where I would start.
  items:
    - label: Continual learning · uncertainty
      title: Uncertainty the learner can act on
      text: >-
        A random index as a second input, trained by the same incremental updates as the model,
        so a deployed learner can choose what to try and what to keep.
    - label: Continual learning · stability
      title: Updates that stay close to their data
      text: >-
        A learner in deployment trains on data from its earlier self. How tightly each update is
        held to that earlier self is a direct handle on stability against plasticity.
    - label: Continual learning · scale
      title: Rules and gauges that hold at scale
      text: >-
        How throughput, exploration and update quality trade as compute grows can be measured,
        with cheap gauges such as the sampler–trainer KL and gradient energy.
  open: >-
    Open questions: forgetting over long horizons, exploration at frontier scale, and where
    uncertainty should live in the architecture.

