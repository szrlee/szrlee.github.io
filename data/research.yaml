# Content for the /research/ page; `adoption` is also used by the homepage highlights.
# Paper keys refer to data/publications.yaml; post keys are folder names under content/post/.

loop:
  title: The object of study is an online RL loop
  text: >-
    A model acts and writes its own experience; from that experience we estimate an update; the
    updated model writes the next experience. Pre-training is this loop with the first arrow cut.
    RL in the lab runs it in rounds and then freezes the model. Online RL in deployment is the
    same loop with no last step. The goal is the most progress per unit of compute, sustained
    over a long horizon.

principles:
  - label: Principle 1
    title: Bounded compute and memory
    text: >-
      At every step, for as long as it runs. A learner cannot keep its whole history or go back
      over it, so every mechanism has to be an incremental update.
  - label: Principle 2
    title: Information-seeking
    text: >-
      It writes its own data, so it should spend experience where it is uncertain. Its
      uncertainty has to be something it can act on, simply and cheaply.
  - label: Principle 3
    title: Faithful to its data
    text: >-
      It learns from what it generated itself, through imperfect machinery. Every update has to
      account for who produced the data and how noisy the signal is.

equation:
  lhs: Progress per unit compute
  factors:
    - name: Samples per unit compute
      kind: Compute efficiency
      label: Principle 1
      text: Keep compute and memory bounded
      href: "#outlook"
    - name: Information per sample
      kind: Data efficiency
      label: Question 1
      text: Which experience to collect?
      href: "#q-explore"
    - name: Fraction each update extracts
      kind: Data efficiency
      label: Questions 2 and 3
      text: Is the update pointed the right way? Is the signal above the noise?
      href: "#q-bias"
  note: >-
    The factors trade. Throughput is bought with fast kernels, asynchrony and larger batches, and
    it is paid for in the last factor. Scaling means raising the first factor without losing the
    others.

questions:
  - id: explore
    label: Question 1 · Exploration
    factor: Information per sample
    title: Which experience to collect?
    text: >-
      Thompson sampling sends the learner where plausible models disagree, and stops exploring on
      its own once they agree. Its price is a fresh posterior sample every round. I build the
      randomness into the model instead: a random index as a second input, trained so that simple
      noise is pushed forward onto the posterior. A sample is one forward pass; an update is one
      SGD step that moves every sample at once. The result is compute-scalable exploration for
      data-efficient learning, from Atari to online language tasks on a GPT-2 backbone. The theory
      rests on a sequential extension of the Johnson–Lindenstrauss lemma to data the agent chose
      itself.
    results:
      - value: 15%
        caption: of DDQN's interaction data for human-level Atari, with 5% of its parameters
      - value: +5%
        caption: over Ensemble+ on online content moderation with a GPT-2 backbone
      - value: d log T
        caption: ensemble directions match Thompson sampling, down from (actions × T)
    papers: [ensemblepp, hyperagent, hyperdqn, seqjl]
    posts: [scalable-exploration, exploration-d-log-t]

  - id: bias
    label: Question 2 · Bias
    factor: Fraction each update extracts
    title: Is the update pointed the right way?
    text: >-
      Large RL runs sample on fast inference engines and train elsewhere. The two engines assign
      different probabilities to the same tokens even at identical weights, and asynchrony adds
      stale data on top, so a run set up to be on-policy is off-policy anyway. We traced LLM-RL
      collapse to this training–inference mismatch, introduced masked importance sampling (MIS),
      made it principled as Trust Region Masking (a sequence mask with per-token importance
      sampling), and built a learning-rate schedule that decays the step size as instability builds.
      Whole sequences are kept or masked and no single token is clipped, so every token's score
      stays centered. Around the
      sampler, the gain of an update is a tangent plus a remainder bounded by the reward range
      times the sequence KL, and
      a batch-size-invariant rule for the step size and the queue keeps the gap fixed as runs grow.
    results:
      - value: O(T)
        caption: trust-region bound for long sequences, down from the classical O(T²)
    papers: [speedkills, trm, beyondprecision, dapo]
    posts: [rl-collapse-training-inference, offpolicy-around-the-sampler, offpolicy-gap-at-scale, topk-routing-stability-gap]

  - id: variance
    label: Question 3 · Variance
    factor: Fraction each update extracts
    title: Is the signal above the noise?
    text: >-
      Even fully on-policy, runs collapse, and a spike in gradient variance comes first: one
      sparse reward multiplies a sum of thousands of token gradients. The best baseline is a
      center of mass weighted by gradient energy. Energy builds up along the rollout, so the
      Optimal Token Baseline is per token, and it costs nothing extra: the logit-gradient norm is
      read off the forward pass.
    results:
      - value: 4 = 32
        caption: group size 4 matches group size 32, about two thirds fewer tokens
      - value: 2×
        caption: more stable training steps and +21% on AIME25 with geometric sequence masking (Qwen3-14B)
    papers: [otb, logit]
    posts: [optimal-token-baseline, information-bandwidth-rl]

