    title: Simple, Unified Analysis of Johnson-Lindenstrauss with Applications
    authors: Yingru Li
    venue: arXiv 2024
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2402.10232"}

  # ---------- Question 2 · Bias ----------
  - key: speedkills
    group: bias
    selected: true
    title: "When Speed Kills Stability: Demystifying RL Collapse from the Training-Inference Mismatch"
    authors: Jiacai Liu*, Yingru Li*†, Yuqian Fu, Jiawei Wang, Qian Liu, Yu Shen
    venue: Technical blog, 2025
    note: Traced LLM-RL collapse to the training–inference mismatch and introduced masked importance sampling (MIS).
    links:
      - {name: Blog, url: "/rl-collapse"}
  - key: trm
    group: bias
    selected: true
    title: Trust Region Masking for Long-Horizon LLM Reinforcement Learning
    authors: Yingru Li, Jiacai Liu, Jiawei Xu, Yuxuan Tong, Ziniu Li, Qian Liu, Baoxiang Wang
    venue: ICML 2026
    note: "The principled form of MIS: a sequence-level trust-region mask with per-token importance sampling; a first-class algorithm in veRL."
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2512.23075"}
      - {name: Blog, url: "/post/trust-region-masking/"}
      - {name: Slides, url: "/trust_region_masking_slides_yingru.pdf"}
  - key: beyondprecision
    group: bias
    selected: true
    title: "Beyond Precision: Training-Inference Mismatch is an Optimization Problem and Simple LR Scheduling Fixes It"
    authors: Yaxiang Zhang*, Yingru Li*†, Jiacai Liu, Jiawei Xu, Ziniu Li, Qian Liu, Haoyuan Li
    venue: arXiv 2026
    note: The mismatch is not a static numerical error; it moves with the size of the update.
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2602.01826"}
      - {name: Blog, url: "/mismatch-lr-schedule"}
  - key: dvp
    group: bias
    title: "Dynamic Vocabulary Pruning: Stable LLM-RL by Taming the Tail"
    authors: Yingru Li, Jiawei Xu, Jiacai Liu, Yuxuan Tong, Ziniu Li, Tianle Cai, Ge Zhang, Qian Liu, Baoxiang Wang
    venue: arXiv 2025
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2512.23087"}
  - key: dapo
    group: bias
    selected: true
    title: Divergence-Augmented Policy Optimization
    authors: Qing Wang*, Yingru Li*, Jiechao Xiong, Tong Zhang
    venue: NeurIPS 2019
    note: Safe reuse of off-policy data through a divergence between state distributions.
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2501.15034"}
  - key: hybrid
    group: bias
    title: "A Note on Hybrid Online Reinforcement and Imitation Learning for LLMs: Formulations and Algorithms"
    authors: Yingru Li, Ziniu Li, Jiacai Liu
    venue: arXiv 2025
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2512.23097"}

