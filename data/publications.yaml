# Single source for the Publications page and the research sections of the homepage.
# `group` must match an `id` in `groups`. Markers: * equal contribution, † corresponding author.

groups:
  - id: explore
    label: Question 1 · Exploration
    title: Which experience to collect?
  - id: bias
    label: Question 2 · Bias
    title: Is the update pointed the right way?
  - id: variance
    label: Question 3 · Variance
    title: Is the signal above the noise?
  - id: systems
    label: Systems and applications
    title: The same tools, at work
  - id: other
    label: Other work
    title: Games, signal processing, networks

papers:
  # ---------- Question 1 · Exploration ----------
  - key: ensemblepp
    group: explore
    selected: true
    title: Scalable Exploration via Ensemble++
    authors: Yingru Li, Jiawei Xu, Baoxiang Wang, Zhi-Quan Luo
    venue: NeurIPS 2025
    note: Regret comparable to exact Thompson sampling with only Θ(d log T) ensemble directions, kept by incremental updates; scales to online language tasks on a GPT-2 backbone.
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2407.13195"}
      - {name: Blog, url: "/post/scalable-exploration/"}
  - key: hyperagent
    group: explore
    selected: true
    title: "Q-Star Meets Scalable Posterior Sampling: Bridging Theory and Practice via HyperAgent"
    authors: Yingru Li, Jiawei Xu, Lei Han, Zhi-Quan Luo
    venue: ICML 2024
    note: Human-level Atari with 15% of DDQN's interaction data (1.5M), as a small addition to DQN.
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2402.10228"}
      - {name: Blog, url: "/post/exploration-d-log-t/"}
      - {name: Slides, url: "/uploads/slides/HyperAgent_slides_ios.pdf"}
  - key: hyperdqn
    group: explore
    selected: true
    title: "HyperDQN: A Randomized Exploration Method for Deep Reinforcement Learning"
    authors: Ziniu Li, Yingru Li†, Yushun Zhang, Tong Zhang, Zhi-Quan Luo
    venue: ICLR 2022
    links:
      - {name: OpenReview, url: "https://openreview.net/forum?id=X0nrKAXu7g-"}
      - {name: Slides, url: "/uploads/slides/HyperDQN_workshop_1214_2021.pdf"}
  - key: seqjl
    group: explore
    selected: true
    title: Probability Tools for Sequential Random Projection
    authors: Yingru Li
    venue: arXiv 2024
    note: A martingale extension of the Johnson–Lindenstrauss lemma to sequentially dependent, adaptively chosen data.
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2402.14026"}
      - {name: Blog, url: "/post/exploration-d-log-t/"}
  - key: psrl
    group: explore
    title: Prior-Dependent Analysis of Posterior Sampling RL with Function Approximation
    authors: Yingru Li, Zhi-Quan Luo
    venue: AISTATS 2024
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2403.11175"}
  - key: ots
    group: explore
    title: Optimistic Thompson Sampling for No-Regret Learning in Unknown Games
    authors: Yingru Li, Liangqi Liu, Wenqiang Pu, Hao Liang, Zhi-Quan Luo
    venue: IEEE Transactions on Signal Processing, 2026
    links:
      - {name: IEEE, url: "https://ieeexplore.ieee.org/document/11534112"}
      - {name: arXiv, url: "https://arxiv.org/abs/2402.09456"}
  - key: verifier
    group: explore
    title: On the Scaling Flaws of Verifier-Guided Beam Search in Mathematical Reasoning
    authors: Fei Yu, Yingru Li, Benyou Wang
    venue: TMLR 2026
    links:
      - {name: OpenReview, url: "https://openreview.net/forum?id=D5VKbIzlrR"}
  - key: uasearch
    group: explore
    title: Robust Search with Uncertainty-Aware Value Models for Language Model Reasoning
    authors: Fei Yu, Yingru Li, Benyou Wang
    venue: arXiv 2025
    links:
      - {name: arXiv, url: "https://arxiv.org/abs/2502.11155"}
  - key: jl
