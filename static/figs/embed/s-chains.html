<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style></head><body><svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" style="display:block;position:fixed;left:0;top:0;width:100%;height:100%"></svg><script>document.documentElement.style.overflow="hidden";document.body.style.margin="0";function makeClock(mode){
var sd=13,rnd=function(){sd=(sd*16807)%2147483647;return (sd-1)/2147483646;};
var g=function(){return Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());};
var NN=48,K=4,a=1,s=1.5,top=[0],bot=[0],i,T=0;
for(i=1;i<=NN;i++)top.push(top[i-1]+a+s*g());
for(i=1;i<=NN/K;i++)bot.push(top[i*K]);
var X=function(n){return 70+n*17.5;};
var Y=function(p,v){return (p?466:224)-(v+8)*2.45;};
var val=function(p,n){return p?bot[Math.floor(n/K+1e-6)]:top[Math.floor(n+1e-6)];};
function stair(p,n){var st=p?K:1,arr=p?bot:top,m=Math.floor(n/st+1e-6),d='M'+X(0)+' '+Y(p,0).toFixed(1),j;
for(j=1;j<=m;j++)d+='H'+X(j*st).toFixed(1)+'V'+Y(p,arr[j]).toFixed(1);return d+'H'+X(n).toFixed(1);}
function band(p){var d='',n;for(n=0;n<=NN;n+=2)d+=(n?'L':'M')+X(n).toFixed(1)+' '+Y(p,a*n+2*s*Math.sqrt(n)).toFixed(1);for(n=NN;n>=0;n-=2)d+='L'+X(n).toFixed(1)+' '+Y(p,a*n-2*s*Math.sqrt(n)).toFixed(1);return d+'Z';}
function svg(n){var o='',p,j,st,W,n0,yb,y1,y0;
o+='<rect x="0" y="0" width="960" height="500" rx="16" fill="#F0EDE4"/>';
for(p=0;p<2;p++){yb=p?466:224;st=p?K:1;
o+='<rect x="40" y="'+(yb-204)+'" width="896" height="222" rx="12" fill="#FAF8F3"/>';
o+='<path d="'+band(p)+'" fill="#161A22" fill-opacity="0.06"/>';
o+='<path d="M'+X(0)+' '+Y(p,0).toFixed(1)+'L'+X(NN)+' '+Y(p,a*NN).toFixed(1)+'" stroke="#9AA0AC" stroke-width="2" stroke-dasharray="6 6"/>';
for(j=0;j<=NN/st;j++)o+='<path d="M'+X(j*st)+' '+(yb+4)+'v10" stroke="#666C78" stroke-width="'+(p?3:2)+'"/>';
W=(mode==1||mode==3)?12:(mode==2?(p?24:6):0);
if(W){n0=Math.max(0,n-W);y0=Y(p,val(p,n0));y1=Y(p,val(p,n));
o+='<rect x="'+X(n0).toFixed(1)+'" y="'+(yb-200)+'" width="'+(X(n)-X(n0)).toFixed(1)+'" height="204" fill="#C2410C" fill-opacity="0.10"/>';
o+='<path d="M'+X(n0).toFixed(1)+' '+y0.toFixed(1)+'H'+(X(n)+18).toFixed(1)+'" stroke="#C2410C" stroke-width="2" stroke-dasharray="4 5"/>';
o+='<path d="M'+(X(n)+18).toFixed(1)+' '+y0.toFixed(1)+'V'+y1.toFixed(1)+'" stroke="#C2410C" stroke-width="5"/>';}
o+='<path d="'+stair(p,n)+'" fill="none" stroke="#1D4ED8" stroke-width="3.5" stroke-linejoin="round"/>';
if(W)o+='<circle cx="'+X(n0).toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="9" fill="#C2410C"/>';
if(mode==3){n0=Math.max(0,n-(p?16:4));o+='<path d="M'+X(n0).toFixed(1)+' '+(yb-150)+'H'+X(n).toFixed(1)+'" stroke="#1D4ED8" stroke-width="7"/><path d="M'+X(n0).toFixed(1)+' '+(yb-160)+'v20M'+X(n).toFixed(1)+' '+(yb-160)+'v20" stroke="#1D4ED8" stroke-width="3"/>';}
o+='<circle cx="'+X(n).toFixed(1)+'" cy="'+Y(p,val(p,n)).toFixed(1)+'" r="10" fill="#1D4ED8"/>';}
return o;}
return {step:function(dt){T+=dt;},svg:svg,cur:function(){return Math.min(1,(T%13)/10)*NN;}};}
var m=makeClock(1),s=document.getElementById("s"),t0=0;function fr(t){var dt=Math.min(0.05,(t-t0)/1000);t0=t;m.step(dt);s.innerHTML=m.svg(m.cur());requestAnimationFrame(fr);}requestAnimationFrame(fr);</script></body></html>
