<script>
var C={"panel":"#F0EDE4","card":"#FAF8F3","ink":"#161A22","soft":"#3F4654","mute":"#666C78","rule":"#C9C2B2","track":"#E4DFD2","gray":"#9AA0AC","or":"#C2410C","orSoft":"#F6D9C2","orMid":"#E08A52","bl":"#1D4ED8","blSoft":"#DCE5FB","blMid":"#7C9BE8"};
function f(v) { return Math.round(v * 10) / 10; }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function rich(s, size) {
  var segs = [], it = false, pos = 'base', buf = '', i, ch;
  function push() { if (buf) segs.push({t: buf, it: it, pos: pos}); buf = ''; }
  for (i = 0; i < s.length; i++) {
    ch = s[i];
    if (ch === '*') { push(); it = !it; continue; }
    if ((ch === '_' || ch === '^') && s[i + 1] === '{') { push(); pos = ch === '_' ? 'sub' : 'sup'; i++; continue; }
    if (ch === '}' && pos !== 'base') { push(); pos = 'base'; continue; }
    buf += ch;
  }
  push();
  var off = {base: 0, sub: 0.3 * size, sup: -0.38 * size}, cur = 0, out = '';
  segs.forEach(function (g) {
    var a = [], dy = off[g.pos] - cur;
    cur = off[g.pos];
    if (dy) a.push('dy="' + f(dy) + '"');

    if (g.it) a.push('font-family="Source Serif 4, Georgia, serif" font-style="italic"');

}
function text(x, y, s, o) {

    '" fill="' + (o.fill || C.ink) + '" text-anchor="' + (o.anchor || 'start') + '"' +
    (o.op != null ? ' fill-opacity="' + o.op + '"' : '') + '>' + rich(s, size) + '</text>';
}
function line(x1, y1, x2, y2, o) {
  o = o || {};
  return '<path d="M' + f(x1) + ' ' + f(y1) + 'L' + f(x2) + ' ' + f(y2) + '" fill="none" stroke="' + (o.stroke || C.ink) +
    '" stroke-width="' + (o.w || 2) + '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') +
    (o.op != null ? ' stroke-opacity="' + o.op + '"' : '') + (o.cap ? ' stroke-linecap="' + o.cap + '"' : '') + '/>';
}
function arrow(x1, y1, x2, y2, o) {
  o = o || {};
  var w = o.w || 3, h = o.head || 4 * w + 6, a = Math.atan2(y2 - y1, x2 - x1);
  var bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a), px = -Math.sin(a) * h * 0.42, py = Math.cos(a) * h * 0.42;
  return line(x1, y1, bx, by, {stroke: o.stroke, w: w, dash: o.dash, op: o.op}) +
    '<path d="M' + f(x2) + ' ' + f(y2) + 'L' + f(bx + px) + ' ' + f(by + py) + 'L' + f(bx - px) + ' ' + f(by - py) +
    'Z" fill="' + (o.stroke || C.ink) + '"' + (o.op != null ? ' fill-opacity="' + o.op + '"' : '') + '/>';
}
function rect(x, y, w, h, o) {
  o = o || {};
  return '<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(Math.max(0, w)) + '" height="' + f(Math.max(0, h)) + '"' +
    (o.rx ? ' rx="' + o.rx + '"' : '') + ' fill="' + (o.fill || 'none') + '"' +
    (o.op != null ? ' fill-opacity="' + o.op + '"' : '') +
    (o.stroke ? ' stroke="' + o.stroke + '" stroke-width="' + (o.sw || 2) + '"' : '') +
    (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>';
}
function dot(x, y, r, o) {
  o = o || {};
  return '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r) + '" fill="' + (o.fill || C.ink) + '"' +
    (o.op != null ? ' fill-opacity="' + o.op + '"' : '') +

function path(d, o) {

    (o.sop != null ? ' stroke-opacity="' + o.sop + '"' : '') +
    (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + ' stroke-linejoin="round" stroke-linecap="round"/>';

function poly(pts) {
  return pts.map(function (p, i) { return (i ? 'L' : 'M') + f(p[0]) + ' ' + f(p[1]); }).join('');
}
function star(x, y, r, o) {
  var pts = [], i, a, rr;
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * Math.PI / 5;
    rr = i % 2 ? r * 0.45 : r;

function rng(seed) {

    var o = rect(0, 0, 960, 380, {rx: 16, fill: C.panel}), i, x;

    var B = 262, H = 170;
    o += line(44, B, 424, B, {stroke: C.rule, w: 2});
    [['tea', p.tea, 84], ['coffee', p.coffee, 184]].forEach(function (t) {
      o += rect(t[2], B - H * t[1], 64, H * t[1], {rx: 6, fill: C.or});
      o += text(t[2] + 32, B + 26, t[0], {size: 17, anchor: 'middle'});
      o += text(t[2] + 32, B - H * t[1] - 10, t[1].toFixed(2), {size: 16, anchor: 'middle', fill: C.soft});
    });
    for (i = 0; i < 34; i++) { x = 292 + i * 4; o += line(x, B, x, B - 2 - 2 * ((i * 7) % 3), {stroke: C.or, w: 2, op: 0.7}); }
    o += text(358, B + 26, '100,000 others', {size: 17, anchor: 'middle'});
    o += text(358, B - 24, rest.toFixed(2) + ' in total', {size: 16, anchor: 'middle', fill: C.soft});
    o += text(488, 54, 'row *c*: Fisher \u221d *μ*(*c*)(1 \u2212 *μ*(*c*))', {size: 18, weight: 600, fill: C.bl});
    var X0 = 510, XW = 400, Y0 = 262, YH = 640;
    o += line(X0, Y0, X0 + XW, Y0, {stroke: C.rule, w: 2}) + line(X0, Y0, X0, Y0 - 0.27 * YH, {stroke: C.rule, w: 2});
    var d = '';
    for (i = 0; i <= 100; i++) d += (i ? 'L' : 'M') + f(X0 + XW * i / 100) + ' ' + f(Y0 - YH * (i / 100) * (1 - i / 100));
    o += path(d, {stroke: C.bl, w: 3});
    o += text(X0, Y0 + 24, '0', {size: 15, anchor: 'middle', fill: C.mute}) + text(X0 + XW, Y0 + 24, '1', {size: 15, anchor: 'middle', fill: C.mute});
    o += text(X0 + XW / 2, Y0 + 24, '*μ*(*c*)', {size: 16, anchor: 'middle', fill: C.mute});

      o += dot(px, py, 8, {fill: C.or});

    });
    var SX = 24, SW = 912, SY = 324;
    o += text(SX, SY - 8, 'share of the output layer\u2019s Fisher', {size: 15, fill: C.soft});
    var wt = SW * ft / tot, wc = SW * fc / tot;
    o += rect(SX, SY, wt, 30, {fill: C.or}) + rect(SX + wt, SY, wc, 30, {fill: C.orMid}) + rect(SX + wt + wc, SY, SW - wt - wc, 30, {fill: C.track});

      '</b>, all other rows <b>' + fr.toFixed(3) + '</b>, of <b>' + tot.toFixed(3) + '</b> in total. Tea and coffee hold <b>' +

  };

PARAMS.forEach(function(q){document.getElementById(q.id).addEventListener('input',function(){update(q.id);});});
