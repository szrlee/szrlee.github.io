    var tpg = (Math.exp(-l0) - 2 * l0 - Math.exp(l0)) / (2 * p.gap), tsf = (1 - l0 - Math.exp(l0)) / 2;
    return 'Time to reach one half: policy gradient <b>' + (tpg < 100 ? tpg.toFixed(1) : Math.round(tpg)) +
      '</b>, demonstration <b>' + tsf.toFixed(1) + '</b>, a ratio of <b>' + Math.round(tpg / tsf) + '\u00d7</b>. ' +
      'Policy gradient grows like 1/(<i>ε</i>Δ); the demonstration like log(1/<i>ε</i>).';
  };
function update(src){var p={};PARAMS.forEach(function(q){p[q.id]=toValue[q.id](+document.getElementById(q.id).value);});p=clamp(p,src);PARAMS.forEach(function(q){if(q.id!==src)document.getElementById(q.id).value=toSlider[q.id](p[q.id]);document.getElementById(q.id+'-out').textContent=show[q.id](p[q.id]);});document.getElementById('fig').innerHTML=draw(p);document.getElementById('read').innerHTML=readout(p);post();}
function post(){parent.postMessage({livefig:"s-amplify",h:document.getElementById('wrap').offsetHeight},'*');}
PARAMS.forEach(function(q){document.getElementById(q.id).addEventListener('input',function(){update(q.id);});});
window.addEventListener('resize',post);window.addEventListener('load',post);post();
</script>
</body></html>
