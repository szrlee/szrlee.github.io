<div class="hp-head{{ with .class }} {{ . }}{{ end }}">
  {{ with .label }}<div class="hp-label">{{ . }}</div>{{ end }}
  {{ with .title }}{{ if eq $.level 1 }}<h1 class="hp-title">{{ . | markdownify }}</h1>{{ else }}<h2 class="hp-title">{{ . | markdownify }}</h2>{{ end }}{{ end }}
  {{ with .text }}<p class="hp-lede">{{ . | markdownify }}</p>{{ end }}
</div>
