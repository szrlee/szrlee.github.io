{{- define "main" -}}

{{ partial "page_header.html" . }}

<div class="universal-wrapper">
  {{ with .Content }}
    <div class="article-style">{{ . }}</div>
  {{ end }}

  <div class="wx-index">
    {{ range .Pages.ByDate.Reverse.GroupByDate "2006" }}
    <section class="wx-year">
      <h2 class="wx-year-label">{{ .Key }}</h2>
      <ul class="wx-list">
        {{ range .Pages }}{{ partial "post/index_row" . }}{{ end }}
      </ul>
    </section>
    {{ end }}
  </div>
</div>

{{- end -}}
