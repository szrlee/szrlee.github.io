{{- /* Post page: the theme's single layout plus an opt-in sidebar (front matter `sidebar:`). */ -}}
{{- define "main" -}}

<article class="article">

  {{ partial "page_header" . }}

  <div class="article-container{{ with .Params.sidebar }} has-post-sidebar{{ end }}">

    <div class="article-style">
      {{ .Content }}
    </div>

    {{ with .Params.sidebar }}{{ partial "post/sidebar" $ }}{{ end }}

    {{ partial "page_footer" . }}

  </div>
</article>

{{- end -}}
