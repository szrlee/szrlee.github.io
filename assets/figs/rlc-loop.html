<script type="application/json" class="stepfig-steps">[{"f": 0, "k": 0, "title": "", "text": ["\u003cp>One set of weights, two implementations. The sampler generates the rollouts; the trainer scores them and computes the gradient.\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}, {"f": 0, "k": 1, "title": "", "text": ["\u003cp>The two engines agree on likely tokens. On unlikely tokens the trainer's probability can be orders of magnitude below the sampler's (Finding 2).\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}, {"f": 0, "k": 2, "title": "", "text": ["\u003cp>Out-of-distribution tool responses make the model sample unlikely tokens more often, and the size of the gap depends on the GPU (Findings 3 and 4).\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}, {"f": 0, "k": 3, "title": "", "text": ["\u003cp>On those batches the trainer's perplexity and the gradient norm spike, and the update is biased and noisy (Finding 1).\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}, {"f": 0, "k": 4, "title": "", "text": ["\u003cp>Hypothesis: the update moves the weights to where rounding matters more, the gap widens, and the loop closes (Finding 5).\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}, {"f": 0, "k": 5, "title": "", "text": ["\u003cp>The fix: mask whole responses whose importance ratio leaves the trust region, before they reach the loss (MIS and Geo-MIS, §4).\u003c/p>"], "note": "Schematic. Bar heights are illustrative."}]</script>
