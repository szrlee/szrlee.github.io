<script type="application/json" class="stepfig-steps">[{"f":0,"k":0,"title":"","text":["\u003cp>Before any data, the posterior is the prior. Draw M = 16 vectors once and keep them: the particles. Side by side they form the matrix A₀, one column per particle.\u003c/p>"],"note":""},{"f":1,"k":0,"title":"","text":["\u003cp>To sample, do not draw a new vector. Draw a random index ξ: one standard Gaussian weight per stored arrow.\u003c/p>"],"note":""},{"f":1,"k":1,"title":"","text":["\u003cp>Scale each arrow by its weight and add them head to tail. Where the path ends is the sample.\u003c/p>"],"note":""},{"f":1,"k":2,"title":"","text":["\u003cp>A different index, the same arrows: a different sample.\u003c/p>"],"note":""},{"f":1,"k":3,"title":"","text":["\u003cp>And a third. Nothing about the arrows changed; only the index did.\u003c/p>"],"note":""},{"f":1,"k":4,"title":"","text":["\u003cp>Many indices fill the prior. This is Ensemble++ in one picture: M stored vectors, one cheap random index per sample.\u003c/p>"],"note":""},{"f":2,"k":0,"title":"","text":["\u003cp>Why is this a prior sample? A linear map of a Gaussian is Gaussian, so only the covariance A₀A₀ᵀ has to match the prior.\u003c/p>"],"note":""},{"f":2,"k":1,"title":"","text":["\u003cp>Pick a direction v and project the stored arrows onto it.\u003c/p>"],"note":""},{"f":2,"k":2,"title":"","text":["\u003cp>Along v, the spread of the cloud (dashed) nearly matches the spread of the prior (solid).\u003c/p>"],"note":""},{"f":2,"k":3,"title":"","text":["\u003cp>It holds in every direction: a random projection that preserves lengths. M of order d is enough, by Johnson–Lindenstrauss.\u003c/p>"],"note":""},{"f":3,"k":0,"title":"","text":["\u003cp>Now data arrive from a linear-Gaussian model, Y = ⟨θ*, X⟩ + ω, whose exact posterior is known: the ground truth for the cloud.\u003c/p>"],"note":""},{"f":3,"k":1,"title":"","text":["\u003cp>The cross is the truth θ*, which the learner never sees.\u003c/p>"],"note":""},{"f":3,"k":2,"title":"","text":["\u003cp>The goal: at every step the covariance of the cloud matches the posterior's, for one cheap update per data point.\u003c/p>"],"note":""},{"f":4,"k":0,"title":"","text":["\u003cp>A data point arrives. The parameters that fit it exactly form a line (dashed); the environment noise is the gap to the truth.\u003c/p>"],"note":""},{"f":5,"k":0,"title":"","text":["\u003cp>Inject noise: each particle gets its own copy of the response plus a fresh draw Z, which we know. One new row in the table.\u003c/p>"],"note":""},{"f":6,"k":0,"title":"","text":["\u003cp>One step each: every particle moves toward its own line. The cloud now sits on the exact posterior, and the injected noise keeps its width right.\u003c/p>"],"note":""},{"f":7,"k":0,"title":"","text":["\u003cp>A second data point: one more row of noise, one more step per particle. Earlier rows are never redrawn, and no data point is stored.\u003c/p>"],"note":""},{"f":8,"k":0,"title":"","text":["\u003cp>After ten: the cloud has collapsed around the truth and its spread still matches the posterior. Memory is the M particles, nothing else.\u003c/p>"],"note":""}]</script>
